<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Almanac</title>
  <meta name="description" content="Your calendars, workouts and plans in one place, synced between your phone and computer.">
  <meta name="theme-color" content="#f3f4f7">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Almanac">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
  <style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><i><b style="background:#e8590c"></b><b style="background:#1c7ed6"></b><b style="background:#d6336c"></b><b style="background:#2f9e44"></b></i>Almanac<span class="sync" id="sync-status" aria-live="polite"></span></div>
    <div class="seg" role="group" aria-label="View">
      <button data-act="mode" data-mode="year" id="m-year">Year</button>
      <button data-act="mode" data-mode="week" id="m-week">Week</button>
      <button data-act="mode" data-mode="day" id="m-day">Day</button>
    </div>
    <button class="btn ghost" data-act="mode" data-mode="library" id="m-library">Library</button>
    <button class="btn ghost" data-act="mode" data-mode="progress" id="m-progress">Progress</button>
    <button class="btn ghost" data-act="mode" data-mode="calendars" id="m-calendars">Calendars</button>
    <button class="btn ghost" data-act="mode" data-mode="friends" id="m-friends">Friends</button>
    <button class="btn ghost icon" data-act="mode" data-mode="settings" id="m-settings" aria-label="Settings" title="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="btn primary" data-act="new" id="new-btn">+ New event</button>
  </div>
</header>
<div class="sub" id="sub"></div>
<main id="main"></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
